# Read-only look at what a Railway service is actually doing, for when a deploy reports
# success and the address does not answer.
#
# It prints variable NAMES and never their values: a deployed service holds the database
# password, the auth secret and Google's client secret, and an Actions log is not the place
# for any of them.
name: Railway diagnose

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which service to look at
        required: true
        default: thrive-web
        type: choice
        options: [thrive-web, thrive-api]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 834caa14-3edb-4e9d-b683-ba9defe6ef06
      RAILWAY_ENVIRONMENT_NAME: production
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun add --global @railway/cli@5.64.2

      - name: Which variables exist (names only)
        run: |
          railway variables \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_NAME" \
            --service "$SERVICE" \
            --json 2>/dev/null | jq -r 'keys[]' || echo "could not read variables"

      - name: The last few deployments
        run: |
          railway deployment list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_NAME" \
            --service "$SERVICE" \
            --limit 3 --json 2>/dev/null \
            | jq -r 'if type=="array" then .[] else .deployments[] end | "\(.status)\t\(.createdAt // "")\t\(.id // "")"' \
            || echo "could not read deployments"

      - name: What the service logged
        run: |
          timeout 60 railway logs \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_NAME" \
            --service "$SERVICE" 2>&1 | tail -80 || true
