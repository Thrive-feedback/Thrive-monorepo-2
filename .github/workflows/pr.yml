# The pipeline every merge candidate runs. Ordered cheapest and broadest first: code style
# and types catch most mistakes in seconds without building anything. Every job runs a
# task a developer runs locally with the same arguments, so a red job reproduces on a
# laptop — `bun run check` is the first four jobs back to back.
#
# Deploys are absent: hosting is PROJECT.md §5 decision 3.
name: PR

on:
  pull_request:
    branches: [main]

# Least privilege: these jobs read the code and publish nothing.
permissions:
  contents: read

# A second push makes the first run's result worthless, so superseded runs cancel.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  style:
    # The name the merge gate requires and the PM reads on the pull request.
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          # The version `devEngines.packageManager` pins, so CI and a laptop agree.
          bun-version-file: package.json
      # The lockfile is the only source of versions; CI never resolves a new one.
      - run: bun install --frozen-lockfile
      # Biome: formatting, lint and import sorting. `--error-on-warnings` because a
      # warning nobody must act on gets ignored, and then it guards nothing.
      - run: bun run check:style

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Type-checking is its own task, run at the strictest setting the code sustains,
      # in every workspace.
      - run: bun run check:types

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The import graph, then the proof that each rule still fires, then the API's
      # specifier-level rules. Runs under Bun, so the command
      # is the same on a laptop whatever Node version happens to be on PATH.
      - run: bun run check:arch

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Regenerates the contract from the API app's route metadata and fails if the
      # committed output moves. Needs no database and no listening server, so it sits with
      # the cheap checks rather than with the suites.
      - run: bun run check:contract

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: package.json
      # The only job that needs Node: apps/web runs its suite on Vitest, and loading
      # `vitest.config.ts` needs Node's native type stripping because `@repo/vitest-config`
      # exports raw `.ts`. Below Node 24 the suite dies with ERR_UNKNOWN_FILE_EXTENSION, which
      # is why `engines.node` is `>=24` (ADR 0013). The API's suite runs on Bun.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run test

  scenarios:
    name: Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `@api` Gherkin suite boots the real API against a real Postgres, the same version
    # compose.yaml runs locally. Only the email provider is faked, inside the suite itself.
    services:
      db:
        image: postgres:17.11
        env:
          POSTGRES_DB: thrive
          POSTGRES_USER: thrive
          POSTGRES_PASSWORD: local_only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U thrive -d thrive"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    # Throwaway values for a database that lives as long as this job. Nothing here reaches
    # Google or Resend: the suite never follows Google's URL and replaces the email sender.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://thrive:local_only@127.0.0.1:54329/thrive
      DATABASE_MIGRATION_URL: postgresql://thrive:local_only@127.0.0.1:54329/thrive
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      BETTER_AUTH_SECRET: ci-only-secret-for-a-database-that-dies-with-the-job
      BETTER_AUTH_URL: http://localhost:3001
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RESEND_FROM_ADDRESS: scenarios@thrive.test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The commands features/README.md gives for a laptop, after `docker compose up`.
      - run: bun run --cwd apps/api db:generate
      - run: bun run --cwd apps/api db:migrate:deploy
      - run: bun run --cwd apps/api test:bdd

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          # Turbo compares this pull request to main to build affected workspaces.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run build --affected
        env:
          # The web build writes the API's address into its callback rewrite. CI deploys
          # nothing, so any well-formed address will do.
          API_BASE_URL: http://localhost:3000
