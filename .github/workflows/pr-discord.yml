# Posts a message to the team's Discord channel when a pull request is opened or reopened.
#
# The webhook URL is a credential, so it lives in the `DISCORD_WEBHOOK_URL` repository
# secret and never in this file (AGENTS.md hard rules).
#
# `pull_request_target` so pull requests from forks can read the secret too. That trigger
# runs with the base repository's secrets, which is only safe because this workflow never
# checks out or executes the pull request's code — keep it that way.
name: PR Discord notification

on:
  pull_request_target:
    types: [opened, reopened]

# Least privilege: the event payload carries everything the message needs.
permissions: {}

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Title, body and branch are author-controlled text, so they reach the shell as
          # environment variables and `jq` builds the JSON — never `${{ }}` inside `run`,
          # which would let a crafted title inject shell commands.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set; skipping the Discord notification."
            exit 0
          fi

          payload=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg url "$PR_URL" \
            --arg number "$PR_NUMBER" \
            --arg author "$PR_AUTHOR" \
            --arg avatar "$PR_AUTHOR_AVATAR" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            --arg draft "$PR_DRAFT" \
            --arg action "$PR_ACTION" \
            --arg repo "$REPO" \
            '{
              username: "GitHub",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ("#" + $number + " " + $title)[0:256],
                url: $url,
                description: (if $body == "" then "_No description._" else $body[0:1000] end),
                color: (if $draft == "true" then 9807270 else 3066993 end),
                author: { name: $author, icon_url: $avatar },
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: ("`" + $head + "` → `" + $base + "`"), inline: true },
                  { name: "Status", value: ((if $action == "reopened" then "Reopened" else "Opened" end) + (if $draft == "true" then " (draft)" else "" end)), inline: true }
                ]
              }]
            }')

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
